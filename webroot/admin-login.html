<!DOCTYPE html>
<html data-bs-theme="light">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
	<title>Admin Login - SVGE</title>
	<link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/fonts/fontawesome-all.min.css">
	<link rel="stylesheet" href="assets/fonts/font-awesome.min.css">
	<link rel="stylesheet" href="assets/css/styles.min.css?v2.2">
	<link rel="stylesheet" href="assets/css/tournament.css">
	<style>
		body {
			background: linear-gradient(135deg, #6e2b31 0%, #4a1f24 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.login-container {
			background: white;
			padding: 40px;
			border-radius: 15px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
			max-width: 450px;
			width: 100%;
		}

		.login-header {
			text-align: center;
			margin-bottom: 30px;
		}

		.login-header img {
			height: 80px;
			margin-bottom: 15px;
		}

		.login-header h2 {
			color: #6e2b31;
			font-weight: bold;
		}

		.login-header p {
			color: #6c757d;
			font-size: 0.9rem;
		}

		.form-label {
			font-weight: 600;
			color: #2a2a2a;
		}

		.btn-login {
			background: #6e2b31;
			border: none;
			padding: 12px;
			font-weight: 600;
			width: 100%;
		}

		.btn-login:hover {
			background: #4a1f24;
		}

		.btn-back {
			background: #6c757d;
			border: none;
			padding: 12px;
			font-weight: 600;
			width: 100%;
			color: white;
			margin-top: 10px;
		}

		.btn-back:hover {
			background: #5a6268;
		}

		.error-message {
			display: none;
			background: #f8d7da;
			color: #721c24;
			padding: 10px;
			border-radius: 5px;
			margin-bottom: 15px;
			border: 1px solid #f5c6cb;
		}

		.error-message.show {
			display: block;
		}
	</style>
</head>

<body>
	<div class="login-container">
		<div class="login-header">
			<img src="assets/img/SVGE_LOGO_NO_TEXT.svg" alt="SVGE Logo">
			<h2>Admin Access</h2>
			<p>Enter password to manage tournaments</p>
		</div>

		<div class="error-message" id="errorMessage">
			<i class="fa fa-exclamation-circle"></i> Incorrect password. Please try again.
		</div>

		<form id="loginForm">
			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input type="password" class="form-control" id="password" placeholder="Enter admin password" required>
			</div>

			<button type="submit" class="btn btn-primary btn-login">
				<i class="fa fa-sign-in"></i> Login
			</button>

			<a href="tournaments.html" class="btn btn-back">
				<i class="fa fa-arrow-left"></i> Back to Tournaments
			</a>
		</form>
	</div>

	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/bootstrap/js/bootstrap.min.js"></script>
	<script>
		document.getElementById('loginForm').addEventListener('submit', function(e) {
			e.preventDefault();
			
			const password = document.getElementById('password').value;
			const errorMsg = document.getElementById('errorMessage');
			
			// Simple password check
			// Default password: "svgeadmin2025"
			const correctPassword = "svgeadmin2025";
			
			if (password === correctPassword) {
				// Store authentication token
				sessionStorage.setItem('adminAuth', 'authenticated');
				sessionStorage.setItem('authTime', Date.now());
				
				// Redirect to tournaments admin
				window.location.href = 'manage-tournaments.html';
			} else {
				errorMsg.classList.add('show');
				document.getElementById('password').value = '';
				document.getElementById('password').focus();
				
				// Hide error after 3 seconds
				setTimeout(() => {
					errorMsg.classList.remove('show');
				}, 3000);
			}
		});
	</script>
</body>

</html>
